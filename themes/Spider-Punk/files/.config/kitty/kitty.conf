# ╔══════════════════════════════════════════════════════════════════╗
# ║  ▓▓ SPIDER-PUNK ▓▓  kitty workstation                            ║
# ║  colours  → themes/spiderpunk.conf   (wallpaper-derived)         ║
# ║  tab bar  → tab_bar.py               (custom, kitty-native)      ║
# ║  ssh      → ssh.conf                 (kitten ssh, unchanged)     ║
# ║  backup   → ~/.config/spiderpunk-backup-20261107-005854/         ║
# ╚══════════════════════════════════════════════════════════════════╝
# Other themes still live in kitty-themes/ — swap the include at the bottom.

# ── typography ────────────────────────────────────────────────────────
# fc-list name: "FantasqueSansM Nerd Font Mono" (Regular/Bold/Italic/BoldItalic installed)
font_family      family="FantasqueSansM Nerd Font Mono"
bold_font        family="FantasqueSansM Nerd Font Mono" style=Bold
italic_font      family="FantasqueSansM Nerd Font Mono" style=Italic
bold_italic_font family="FantasqueSansM Nerd Font Mono" style="Bold Italic"
font_size 14.0
# a little more leading than the font default: poster-like air, still dense
modify_font cell_height 112%
modify_font underline_position 2
modify_font underline_thickness 140%
undercurl_style thick-sparse
# keep box-drawing / powerline glyphs pixel-perfect (tab cuts, prompt slabs)
box_drawing_scale 0.001, 1, 1.5, 2
disable_ligatures cursor

# ── cursor: crimson block with a magenta ink-smear trail ──────────────
cursor_shape block
cursor_shape_unfocused hollow
cursor_beam_thickness 2
cursor_blink_interval 0.7 ease-in-out
cursor_stop_blinking_after 12.0
# Animated cursor (was: cursor_trail 1)
cursor_trail 3
cursor_trail_decay 0.08 0.35
cursor_trail_start_threshold 3

# ── window: sharp, editorial, no rounding ─────────────────────────────
background_opacity 0.92
dynamic_background_opacity 1
confirm_os_window_close 0
hide_window_decorations yes
window_padding_width 8 12
single_window_padding_width 10 14
window_margin_width 0
window_border_width 1.5pt
draw_minimal_borders yes
# inactive splits fade like an under-inked print → focus is obvious
inactive_text_alpha 0.68
placement_strategy top-left
resize_debounce_time 0.05 0.3
remember_window_size no

# change to x11 or wayland or leave auto
linux_display_server auto
# remote control only through the socket (blocks escape-code control from untrusted remote output)
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

# ── scrollback ────────────────────────────────────────────────────────
scrollback_lines 20000
wheel_scroll_min_lines 1
scrollbar scrolled
scrollbar_width 0.4
scrollbar_hover_width 0.8
scrollbar_radius 0
scrollbar_gap 0.1
scrollbar_handle_color #e0323f
scrollbar_handle_opacity 0.75
scrollbar_track_color #3a1520
scrollbar_track_opacity 0.3

# ── bell: punk muted-pick sound + short dark-red flash + yellow border + tab marker
#    (zsh's own completion beeps are switched off in ~/.config/zsh/spiderpunk.zsh,
#     so this only rings for real bells: `printf '\a'`, finished jobs, vim errors…)
enable_audio_bell yes
bell_path /home/dog/.local/share/sounds/SpiderPunk/stereo/bell.oga
linux_bell_theme SpiderPunk
visual_bell_duration 0.18 ease-out
visual_bell_color #3a0d16
window_alert_on_bell yes
bell_on_tab "󰂞 "

selection_foreground none
selection_background none
# ^ kept from your config; the theme include below sets real selection colours

# ── tab bar: ripped-poster slabs (see tab_bar.py) ─────────────────────
tab_bar_edge top
tab_bar_style custom
tab_bar_align left
tab_bar_min_tabs 1
tab_bar_margin_width 0
tab_bar_margin_height 4 2
tab_title_max_length 26
tab_activity_symbol none
tab_title_template "{title}"
active_tab_font_style bold
inactive_tab_font_style normal

# ── layouts ───────────────────────────────────────────────────────────
#   splits = free-form panes (default)   tall = editor + stack
#   fat / grid for monitoring            stack = zoom one pane
enabled_layouts splits:split_axis=auto,tall:bias=60,fat,grid,stack

# ── keys (added; all kitty defaults are untouched) ────────────────────
# Hyprland already owns CTRL+ALT+W/Delete and ALT+SHIFT(+S); none reused here.
# splits — always open in the current directory, quiet (no startup banner)
map ctrl+alt+v      launch --location=vsplit --cwd=current --env SPIDERPUNK_QUIET=1
map ctrl+alt+s      launch --location=hsplit --cwd=current --env SPIDERPUNK_QUIET=1
map ctrl+alt+enter  launch --location=split  --cwd=current --env SPIDERPUNK_QUIET=1
# focus panes (vim keys + arrows)
map ctrl+alt+h      neighboring_window left
map ctrl+alt+j      neighboring_window down
map ctrl+alt+k      neighboring_window up
map ctrl+alt+l      neighboring_window right
# resize focused pane
map ctrl+alt+left   resize_window narrower 3
map ctrl+alt+right  resize_window wider 3
map ctrl+alt+up     resize_window taller 2
map ctrl+alt+down   resize_window shorter 2
map ctrl+alt+0      reset_window_sizes
# layout tricks
map ctrl+alt+z      toggle_layout stack
map ctrl+alt+r      layout_action rotate
map ctrl+alt+g      goto_layout grid
map ctrl+alt+t      goto_layout tall
# tabs by number
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
# DEV DECK: new tab →  ┌ editor ────────┬ lazygit (if in a repo) ┐
#                      │                ├────────────────────────┤
#                      ├ server / logs  ┤ btop                   │
#                      └────────────────┴────────────────────────┘
# (btop needs ≥80×24 cells — it gets 55% of a full-height column)
map ctrl+alt+d combine : launch --type=tab --cwd=current --tab-title=DECK --env SPIDERPUNK_QUIET=1 : goto_layout splits : launch --location=vsplit --cwd=current --bias=45 --env SPIDERPUNK_QUIET=1 zsh -c "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && lazygit; exec zsh" : launch --location=hsplit --cwd=current --bias=55 --env SPIDERPUNK_QUIET=1 zsh -c "btop; exec zsh" : neighboring_window left : launch --location=hsplit --cwd=current --bias=30 --env SPIDERPUNK_QUIET=1 : neighboring_window up
# opacity: o = solid, i = back to 0.92
map ctrl+alt+o      set_background_opacity 1
map ctrl+alt+i      set_background_opacity default
# palette swatch / doctor
map ctrl+alt+p      launch --type=overlay --env SPIDERPUNK_QUIET=1 /home/dog/.config/kitty/scripts/theme-utils.sh palette --wait

# ---- SSH / remote features ----
shell_integration enabled
# OSC 52: let remote programs (vim, tmux) copy to your clipboard; reading asks first
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
# clickable links (ls --hyperlink, kitten ssh, grep), ctrl+click
allow_hyperlinks yes
mouse_map ctrl+left click ungrabbed mouse_handle_click link
# notifications / desktop features from remote shells
notify_on_cmd_finish unfocused 15.0
term xterm-kitty

# ── theme (must stay last so it wins) ─────────────────────────────────
include /home/dog/.config/kitty/themes/spiderpunk.conf
