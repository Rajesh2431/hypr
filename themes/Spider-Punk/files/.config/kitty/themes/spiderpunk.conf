# ╔══════════════════════════════════════════════════════════════════╗
# ║  SPIDER-PUNK // kitty colour scheme                              ║
# ║  Derived from ~/Pictures/wallpapers/26505000.jpg (2026-11-07)    ║
# ╚══════════════════════════════════════════════════════════════════╝
#
#  Wallpaper sample            →  terminal role
#  #11070A  ink-black (35% px)  →  background        #0f0709
#  #300A0B / #4E0E10 oxblood    →  surface / borders #1c0d12 #3a1520
#  #9e263a / #D44444 speakers   →  CRIMSON primary   #e0323f
#  #ab178d / #aa2365 halftone   →  MAGENTA highlight #d63a9c
#  #87209a / #561f87 violet sky →  VIOLET support    #9b5de5
#  #1c318a / #18569b cobalt     →  COBALT secondary  #3f6fff
#  #1c8eb7 / #558E8D teal haze  →  CYAN info         #2aa9cf
#  #c2aa3c lightning bolts      →  YELLOW warning    #f2c53d
#  #b76823 rust orange          →  ORANGE secondary  #f07a2a
#  #bbc541 acid poster ink      →  ACID success      #a8c43a
#  #E7D4D5 torn-paper cutout    →  off-white text    #eedfd9
#  #A2979D photocopy grey       →  muted text        #a2939a
#
#  Hierarchy: crimson = focus/identity, cobalt = structure, yellow = attention,
#  magenta/violet = decoration. Red is NOT used for everything.

# ── base ──────────────────────────────────────────────────────────────
foreground              #eedfd9
background              #0f0709
selection_foreground    #0f0709
selection_background    #f2c53d
url_color               #2aa9cf
url_style               curly

# ── cursor ────────────────────────────────────────────────────────────
cursor                  #e0323f
cursor_text_color       #0f0709
cursor_trail_color      #d63a9c

# ── ANSI 16 ───────────────────────────────────────────────────────────
#: black / bright black (bright black is used for comments & autosuggestions,
#: so it is kept readable: ~4.2:1 on the background)
color0   #1c0d12
color8   #6e5662
#: red — crimson speaker cabinets
color1   #e0323f
color9   #ff5c66
#: green — acid poster ink (not hacker-neon)
color2   #a8c43a
color10  #cbe35a
#: yellow — lightning bolts
color3   #f2c53d
color11  #ffe07a
#: blue — cobalt halftone
color4   #3f6fff
color12  #7d9cff
#: magenta — spray-paint magenta
color5   #d63a9c
color13  #f572c4
#: cyan — teal haze
color6   #2aa9cf
color14  #74d6ef
#: white — torn paper
color7   #d6c4bf
color15  #fff4ee

# ── window borders (splits) ───────────────────────────────────────────
active_border_color     #e0323f
inactive_border_color   #3a1520
bell_border_color       #f2c53d

# ── tab bar ───────────────────────────────────────────────────────────
tab_bar_background      #0a0406
tab_bar_margin_color    #0a0406
active_tab_foreground   #fff4ee
active_tab_background   #c8243a
inactive_tab_foreground #a2939a
inactive_tab_background #1c0d12

# ── marks (kitty "mark" feature: ctrl+shift+f1.. via create_marker) ──
mark1_foreground #0f0709
mark1_background #f2c53d
mark2_foreground #0f0709
mark2_background #d63a9c
mark3_foreground #fff4ee
mark3_background #3f6fff

# ── wayland client-side titlebar (only used when the compositor asks
#    kitty to draw decorations; Hyprland normally doesn't) ─────────────
wayland_titlebar_color  #0f0709
