# Lock screen images (sourced by hyprlock.conf).
# Kept in its own file because HyprlockWallpaperSelect.sh rewrites every "path =" line in hyprlock.conf.
# Art: waybar/assets/punk/lock/make-comic.py (overlay, burst), make-avatar.py (avatar)

# full-screen comic overlay: halftone corners, speed lines, ink vignette
image {
    monitor =
    path = ~/.config/hypr/waybar/assets/punk/lock/overlay.png
    size = 1080
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# starburst behind the avatar
image {
    monitor =
    path = ~/.config/hypr/waybar/assets/punk/lock/burst.png
    size = 250
    rounding = 0
    border_size = 0
    rotate = 6
    position = 0, 34
    halign = center
    valign = center
    zindex = 2
}

# round portrait avatar with a thick ink ring
image {
    monitor =
    path = ~/.config/hypr/waybar/assets/punk/lock/avatar.png
    size = 150
    rounding = -1
    border_size = 6
    border_color = rgb(050306)
    position = 0, 34
    halign = center
    valign = center
    zindex = 3
}

# now-playing comic panel: tinted with the cover's colour; transparent when nothing plays
image {
    monitor =
    path = ~/.config/hypr/waybar/assets/punk/lock/blank.png
    reload_time = 2
    reload_cmd = ~/.config/hypr/UserScripts/LockMedia.sh card
    size = 124
    rounding = 0
    border_size = 0
    position = 40, 28
    halign = left
    valign = bottom
    zindex = 1
}

# now-playing cover, inked square
image {
    monitor =
    path = ~/.config/hypr/waybar/assets/punk/lock/blank.png
    reload_time = 2
    reload_cmd = ~/.config/hypr/UserScripts/LockMedia.sh art
    size = 86
    rounding = 0
    border_size = 4
    border_color = rgb(050306)
    position = 56, 51
    halign = left
    valign = bottom
    zindex = 2
}
