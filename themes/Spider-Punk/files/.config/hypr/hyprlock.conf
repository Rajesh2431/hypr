# ==================================================================
#  SPIDER-PUNK lock screen: comic edition (smooth centred layout, comic ink treatment)
#    overlay     : halftone corners + speed lines + ink vignette   (hyprlock-punk-art.conf)
#    centre      : misprinted clock, date on yellow tape, avatar on a starburst, greeting,
#                  password in a speech bubble
#    bottom-left : now-playing comic panel tinted with the cover's colour (UserScripts/LockMedia.sh)
#    bottom-right: power caption box + weather
#  Images live in hyprlock-punk-art.conf: HyprlockWallpaperSelect.sh rewrites every "path =" here.
#  Previous designs: .bak-smooth (glass), .bak-cover (torn panels), .bak-punk (KoolDots)
# ==================================================================
$ink     = rgb(050306)
$paper   = rgb(F5F0E8)
$sub     = rgba(245, 240, 232, 0.7)
$faint   = rgba(245, 240, 232, 0.4)
$crimson = rgb(FF1744)
$blue    = rgb(00B8FF)
$yellow  = rgb(FFD43B)
$orange  = rgb(FF6B24)
$Media   = $HOME/.config/hypr/UserScripts/LockMedia.sh

general {
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = smooth, 0.22, 1, 0.36, 1
    bezier = punch, 0.3, 1.5, 0.5, 1
    animation = fadeIn, 1, 6, smooth
    animation = fadeOut, 1, 5, smooth
    animation = inputFieldDots, 1, 3, punch
    animation = inputFieldColors, 1, 5, smooth
    animation = inputFieldFade, 1, 5, smooth
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current # current wallpaper
    color = rgb(0B090D)
    blur_size = 7
    blur_passes = 3
    noise = 0.03          # print grain
    contrast = 1.1
    brightness = 0.45
    vibrancy = 0.3
    vibrancy_darkness = 0.1
}

# ---------------- clock: paper numerals with a red / blue misprint ----------------
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba(0, 184, 255, 0.9)
    font_size = 160
    font_family = Bangers
    rotate = -2
    position = 8, 294
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba(255, 23, 68, 0.9)
    font_size = 160
    font_family = Bangers
    rotate = -2
    position = -7, 304
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = $paper
    font_size = 160
    font_family = Bangers
    rotate = -2
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $ink
    shadow_boost = 2.0
    position = 0, 300
    halign = center
    valign = center
    zindex = 2
}

# date on a strip of yellow tape
shape {
    monitor =
    size = 430, 50
    color = $ink
    rounding = 0
    rotate = 2
    position = 6, 166
    halign = center
    valign = center
    zindex = 1
}
shape {
    monitor =
    size = 430, 50
    color = $yellow
    rounding = 0
    border_size = 4
    border_color = $ink
    rotate = 2
    position = 0, 172
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:60000] date +'%A · %-d %B' | tr a-z A-Z
    color = $ink
    font_size = 26
    font_family = Bebas Neue
    rotate = 2
    position = 0, 172
    halign = center
    valign = center
    zindex = 3
}

# ---------------- greeting (avatar + burst images in hyprlock-punk-art.conf) ----------------
label {
    monitor =
    text = cmd[update:600000] h=$(date +%H); g="EVENING"; [ $h -lt 18 ] && g="AFTERNOON"; [ $h -lt 12 ] && g="MORNING"; [ $h -lt 5 ] && g="STILL UP"; echo "$g, $(echo $USER | tr a-z A-Z)!"
    color = $paper
    font_size = 26
    font_family = Bangers
    shadow_passes = 1
    shadow_size = 3
    shadow_color = $ink
    shadow_boost = 2.0
    position = 0, -104
    halign = center
    valign = center
    zindex = 3
}

# ---------------- password: speech bubble ----------------
input-field {
    monitor =
    size = 380, 62
    outline_thickness = 4
    rounding = 31
    outer_color = $ink
    inner_color = $paper
    font_color = $ink
    font_family = Bangers
    check_color = $yellow
    fail_color = $crimson
    capslock_color = $orange
    dots_size = 0.26
    dots_spacing = 0.4
    dots_rounding = 0          # square ink stamps
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##6A5A65" font_size="17pt">SAY THE MAGIC WORD…</span>
    fail_text = <span foreground="##FF1744" font_size="16pt">NOPE! TRY AGAIN · $ATTEMPTS</span>
    hide_input = false
    position = 0, -168
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = $LAYOUT
    color = $faint
    font_size = 10
    font_family = Noto Sans
    position = 0, -224
    halign = center
    valign = center
}

# ---------------- now playing: comic panel (card + cover images in hyprlock-punk-art.conf) ----------------
label {
    monitor =
    text = cmd[update:2000] $Media source
    color = $crimson
    font_size = 15
    font_family = Bangers
    position = 158, 118
    halign = left
    valign = bottom
    zindex = 3
}
label {
    monitor =
    text = cmd[update:2000] $Media title
    color = $paper
    font_size = 22
    font_family = Bebas Neue
    position = 158, 82
    halign = left
    valign = bottom
    zindex = 3
}
label {
    monitor =
    text = cmd[update:2000] $Media artist
    color = $sub
    font_size = 12
    font_family = Noto Sans
    position = 158, 58
    halign = left
    valign = bottom
    zindex = 3
}

# ---------------- bottom-right: power caption box + weather ----------------
label {
    monitor =
    text = cmd[update:60000] f="$HOME/.cache/.weather_cache"; [ -f "$f" ] && echo "$(sed -n 2p "$f" | sed 's/^[^A-Za-z]*//')  ·  $(sed -n 3p "$f" | grep -o '[0-9-]*°C' | head -1)" | tr a-z A-Z
    color = $sub
    font_size = 18
    font_family = Bebas Neue
    shadow_passes = 1
    shadow_color = $ink
    position = -46, 100
    halign = right
    valign = bottom
    zindex = 3
}
shape {
    monitor =
    size = 290, 46
    color = $blue
    rounding = 0
    position = -32, 40
    halign = right
    valign = bottom
    zindex = 1
}
shape {
    monitor =
    size = 290, 46
    color = $yellow
    rounding = 0
    border_size = 4
    border_color = $ink
    position = -40, 48
    halign = right
    valign = bottom
    zindex = 2
}
label {
    monitor =
    text = cmd[update:10000] b=/sys/class/power_supply/BAT0; s=$(cat $b/status); echo "POWER $(cat $b/capacity)%  ·  $([ "$s" = Discharging ] && echo ON BATTERY || echo "${s^^}")"
    color = $ink
    font_size = 22
    font_family = Bebas Neue
    position = -56, 56
    halign = right
    valign = bottom
    zindex = 3
}

# tagline
label {
    monitor =
    text = NO GODS. NO MASTERS. NO SCREEN TIME.
    color = $crimson
    font_size = 18
    font_family = Bangers
    rotate = -2
    shadow_passes = 1
    shadow_size = 2
    shadow_color = $ink
    position = 0, 34
    halign = center
    valign = bottom
    zindex = 3
}

# images: overlay, burst, avatar, now-playing card + cover
source = ~/.config/hypr/hyprlock-punk-art.conf
