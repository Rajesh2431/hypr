# cava for the Dynamic Island: 12 bars, numbers 0-7 per frame, one frame per line
[general]
framerate = 30
bars = 12
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 60
