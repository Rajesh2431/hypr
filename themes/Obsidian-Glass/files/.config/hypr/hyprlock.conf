# ==================================================================
#  OBSIDIAN GLASS lock screen
#    centre      : thin clock, date, greeting, rounded glass password field
#    bottom-left : now-playing glass card (UserScripts/LockMedia.sh … glass), cover tinted glow
#    bottom-right: battery + weather
#  Images live in hyprlock-punk-art.conf (the file name is shared by every style):
#  HyprlockWallpaperSelect.sh rewrites every "path =" line in this file.
#  Switch styles with Super+Alt+T (UserScripts/Styles.sh).
# ==================================================================
$text    = rgb(E6E8F0)
$sub     = rgba(156, 164, 181, 0.95)
$muted   = rgba(104, 113, 132, 0.9)
$accent  = rgb(78B9E7)
$cyan    = rgb(7ED6DE)
$red     = rgb(E06C75)
$yellow  = rgb(E5C07B)
$Media   = $HOME/.config/hypr/UserScripts/LockMedia.sh

general {
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

animations {
    enabled = true
    bezier = glass, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, glass
    animation = fadeOut, 1, 4, glass
    animation = inputFieldDots, 1, 2, glass
    animation = inputFieldColors, 1, 4, glass
    animation = inputFieldFade, 1, 4, glass
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current # current wallpaper
    color = rgb(101116)
    blur_size = 8
    blur_passes = 3
    noise = 0.012
    contrast = 1.0
    brightness = 0.55
    vibrancy = 0.12
    vibrancy_darkness = 0.0
}

# ---------------- clock + date ----------------
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = $text
    font_size = 112
    font_family = Noto Sans Thin
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, 250
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = $sub
    font_size = 17
    font_family = Noto Sans
    position = 0, 150
    halign = center
    valign = center
}

# ---------------- greeting + password ----------------
label {
    monitor =
    text = cmd[update:600000] h=$(date +%H); g="Good evening"; [ $h -lt 18 ] && g="Good afternoon"; [ $h -lt 12 ] && g="Good morning"; [ $h -lt 5 ] && g="Still up"; echo "$g, $USER"
    color = $text
    font_size = 15
    font_family = Noto Sans Light
    position = 0, 10
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 52
    outline_thickness = 1
    rounding = 26
    outer_color = rgba(57, 66, 81, 0.9)
    inner_color = rgba(25, 27, 35, 0.62)
    font_color = $text
    font_family = Noto Sans
    check_color = $accent
    fail_color = $red
    capslock_color = $yellow
    dots_size = 0.2
    dots_spacing = 0.45
    dots_rounding = -1
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##687184" font_size="12pt">Password</span>
    fail_text = <span foreground="##E06C75" font_size="11pt">Wrong password · $ATTEMPTS</span>
    hide_input = false
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.3)
    position = 0, -54
    halign = center
    valign = center
}
label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 10
    font_family = Noto Sans
    position = 0, -104
    halign = center
    valign = center
}

# ---------------- now playing (card + cover images in hyprlock-punk-art.conf) ----------------
label {
    monitor =
    text = cmd[update:2000] $Media source glass
    color = $accent
    font_size = 10
    font_family = Noto Sans Medium
    position = 158, 118
    halign = left
    valign = bottom
    zindex = 3
}
label {
    monitor =
    text = cmd[update:2000] $Media title
    color = $text
    font_size = 15
    font_family = Noto Sans Medium
    position = 158, 86
    halign = left
    valign = bottom
    zindex = 3
}
label {
    monitor =
    text = cmd[update:2000] $Media artist
    color = $sub
    font_size = 11
    font_family = Noto Sans
    position = 158, 60
    halign = left
    valign = bottom
    zindex = 3
}

# ---------------- bottom-right: battery + weather ----------------
label {
    monitor =
    text = cmd[update:60000] f="$HOME/.cache/.weather_cache"; [ -f "$f" ] && echo "$(sed -n 2p "$f" | sed 's/^[^A-Za-z]*//')  ·  $(sed -n 3p "$f" | grep -o '[0-9-]*°C' | head -1)"
    color = $sub
    font_size = 12
    font_family = Noto Sans
    position = -44, 74
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:10000] b=/sys/class/power_supply/BAT0; s=$(cat $b/status); c=$(cat $b/capacity); i="󰁹"; [ $c -lt 60 ] && i="󰁾"; [ $c -lt 30 ] && i="󰁻"; [ "$s" = Charging ] && i="󰂄"; echo "$i  $c%"
    color = $text
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -44, 44
    halign = right
    valign = bottom
}

# images: now-playing card + cover
source = ~/.config/hypr/hyprlock-punk-art.conf
