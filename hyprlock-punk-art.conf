# Lock screen images for Obsidian Glass (sourced by hyprlock.conf; the file name is shared by every style).
# Kept in its own file because HyprlockWallpaperSelect.sh rewrites every "path =" line in hyprlock.conf.

# now-playing glass card: tinted glow from the cover's colour; transparent when nothing plays
image {
    monitor =
    path = ~/.config/hypr/waybar/assets/punk/lock/blank.png
    reload_time = 2
    reload_cmd = ~/.config/hypr/UserScripts/LockMedia.sh card glass
    size = 124
    rounding = 0
    border_size = 0
    position = 40, 28
    halign = left
    valign = bottom
    zindex = 1
}

# now-playing cover, rounded
image {
    monitor =
    path = ~/.config/hypr/waybar/assets/punk/lock/blank.png
    reload_time = 2
    reload_cmd = ~/.config/hypr/UserScripts/LockMedia.sh art
    size = 86
    rounding = 12
    border_size = 0
    position = 56, 51
    halign = left
    valign = bottom
    zindex = 2
}
